<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_assert.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bisolhador</title>
    <!--
      Content-Security-Policy — domínios liberados com base no que o código realmente chama,
      não uma lista genérica de tutorial:
      - script-src: 'self' (bundle Vite) + googletagmanager.com, de onde o react-ga4 injeta o
        gtag.js (ver node_modules/react-ga4/src/ga4.js, gtagUrl default) + 'wasm-unsafe-eval':
        o layout do @react-pdf/renderer (relatório PDF do Modo Turma, src/report/) carrega o
        yoga em WebAssembly. A diretiva só permite compilar WebAssembly; NÃO libera eval() nem
        new Function() de JavaScript. Confirmado no navegador: sem ela o relatório falha com
        "WebAssembly.instantiate() violates ... script-src".
      - connect-src: 'self' + api.github.com (src/services/githubService.js, único host chamado)
        + %VITE_SUPABASE_URL% (src/services/supabase.js — usa a env var real da build via o
        "HTML env replacement" nativo do Vite, em vez de hardcodar o domínio ou usar um wildcard
        *.supabase.co, que permitiria exfiltração para QUALQUER projeto Supabase de terceiros)
        + google-analytics.com / *.google-analytics.com / *.analytics.google.com /
        googletagmanager.com (destinos documentados de coleta do gtag.js — não são chamados
        diretamente pelo nosso código, então não dá pra confirmar por grep, só pela doc do GA4)
        + data: (o mesmo yoga busca o próprio .wasm como data URI embutida no bundle; data: não
        sai da página, então não abre caminho de exfiltração como um host externo abriria).
      - img-src: 'self' + avatars.githubusercontent.com (contributor.avatar_url em
        ContributorsTable.jsx, BusFactorCard.jsx e ActivityLogs.jsx)
        + *.google-analytics.com / www.googletagmanager.com (hits do gtag.js via <img>, conforme
        o guia de CSP do GA4: developers.google.com/tag-platform/security/guides/csp; o pixel
        googletagmanager.com/td já apareceu como violação no npm run smoke:csp). Sem data:
        (v3.22.0): vinha do html2canvas, removido do export de PDF na v3.21.0.
      - style-src: 'self', sem estilo inline (v3.22.0). Os style={{...}} do React usam a CSSOM
        (propriedade por propriedade), que a CSP não bloqueia; o 'unsafe-inline' existia por causa do
        html2canvas (export de PDF antigo, removido na v3.21.0), que aplicava estilo via
        setAttribute('style', ...)/cssText. Provado por npm run smoke:csp (0 violações no build
        de produção em todas as rotas e nos dois PDFs). O servidor de desenvolvimento do Vite injeta
        <style> (@vite/client): só ele recebe 'unsafe-inline', por um plugin de vite.config.js
        (apply: 'serve'); o build e o vite preview mantêm a política estrita.
      - font-src: 'self' — nenhuma fonte externa (sem Google Fonts/CDN, confirmado em index.css
        e tailwind.config.js).
      - object-src 'none' / base-uri 'self' — hardening padrão, sem uso conhecido no app.
      Limitação conhecida: frame-ancestors, report-uri e sandbox são ignorados quando a CSP vem
      de <meta> (só funcionam via header HTTP real). GitHub Pages não permite configurar headers
      HTTP customizados nativamente, então proteção contra clickjacking não é coberta aqui.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; style-src 'self'; img-src 'self' https://avatars.githubusercontent.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://api.github.com %VITE_SUPABASE_URL% https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com data:; object-src 'none'; base-uri 'self';"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
