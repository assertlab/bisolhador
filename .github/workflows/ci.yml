name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR: um grupo por PR, cancelando runs antigos. main: um grupo por commit.
# Agrupar main por ref não basta: o GitHub mantém só um run pendente por grupo,
# e um push novo substitui o pendente anterior mesmo com cancel-in-progress
# false (aconteceu com o merge do #42, cancelado pelo do #37).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nome estável: é o status check obrigatório no ruleset protect-main.
  # Renomear este job exige atualizar o ruleset também (por isso continua
  # "lint + build" mesmo rodando os testes unitários).
  verify:
    name: lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Sem secrets: valida que compila; o bundle gerado aqui não é publicado.
      - run: npm run build

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Compara base x head pela API do dependency graph; não precisa de checkout.
      # Barra o PR que introduz dependência de runtime com vulnerabilidade high+.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
