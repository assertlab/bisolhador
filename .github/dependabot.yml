version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Um PR semanal por grupo em vez de um por pacote; majors continuam isolados, exceto nos grupos eslint, i18n e vite.
    groups:
      # ESLint e plugins quebram separados (peer ranges, regras novas no
      # recommended): todas as versões, majors inclusive, num PR só.
      # Os grupos são disjuntos de propósito (exclude-patterns abaixo): a doc só
      # diz "first group that it matches", sem definir a ordem, e na prática o
      # react-refresh caiu em dev-minor-patch mesmo com este grupo listado antes.
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*']
      # Mesmo problema: react-i18next N exige i18next de uma faixa específica.
      i18n:
        patterns: ['i18next', 'react-i18next', 'i18next-*']
      # @vitejs/plugin-react N exige vite N (e vice-versa): #50/#52 falharam separados.
      vite:
        patterns: ['vite', '@vitejs/*']
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ['i18next', 'react-i18next', 'i18next-*']
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'vite', '@vitejs/*']
    ignore:
      # Substitui um check obrigatório que o CI ainda não tem: o v4 passa em lint+build mas
      # quebra o export de PDF (ver docs/ROADMAP.md). O job `smoke` do CI já
      # pega isso, mas ainda não é obrigatório: remover quando for.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
