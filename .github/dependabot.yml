version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Um PR semanal por grupo em vez de um por pacote; majors continuam isolados.
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Substitui um check que o CI ainda não tem: o v4 passa em lint+build mas
      # quebra o export de PDF (ver docs/ROADMAP.md). Remover quando smoke:csp
      # rodar no CI.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
