version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Um PR semanal por grupo em vez de um por pacote; majors continuam isolados, exceto no grupo eslint.
    groups:
      # ESLint e plugins quebram separados (peer ranges, regras novas no
      # recommended): todas as versões, majors inclusive, num PR só.
      # Os grupos são disjuntos de propósito (exclude-patterns abaixo): a doc só
      # diz "first group that it matches", sem definir a ordem, e na prática o
      # react-refresh caiu em dev-minor-patch mesmo com este grupo listado antes.
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*']
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['eslint', '@eslint/*', 'eslint-plugin-*']
    ignore:
      # Substitui um check que o CI ainda não tem: o v4 passa em lint+build mas
      # quebra o export de PDF (ver docs/ROADMAP.md). Remover quando smoke:csp
      # rodar no CI.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
